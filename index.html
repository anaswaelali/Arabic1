<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<title>منصة الصف الأول الابتدائي - الترم الأول</title>
<style>
    :root {
        --primary: #2E86AB; --secondary: #F18F01; --pink: #FF6B9D;
        --purple: #9B5DE5; --green: #27AE60; --yellow: #FFD23F;
        --sky: #48CAE4; --dark: #2C3E50; --danger: #E74C3C;
        --font-stack: 'Segoe UI', 'Tahoma', 'Arial', 'Helvetica Neue', sans-serif;
        --english-font: 'Segoe UI', 'Arial', 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; font-family: var(--font-stack); }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body { background: linear-gradient(135deg, #FFE5F1 0%, #E0F7FA 50%, #FFF9C4 100%); background-attachment: fixed; color: var(--dark); min-height: 100vh; position: relative; overflow-x: hidden; font-size: 16px; line-height: 1.6; }
    body::before { content: "⭐"; position: fixed; top: 8%; left: 5%; font-size: 3rem; opacity: 0.12; pointer-events: none; animation: twinkle 3s ease-in-out infinite alternate; }
    body::after { content: "✨"; position: fixed; bottom: 8%; right: 5%; font-size: 2.4rem; opacity: 0.12; pointer-events: none; animation: twinkle 4s ease-in-out infinite alternate; }
    @keyframes twinkle { 0% { opacity: 0.08; transform: scale(0.9); } 100% { opacity: 0.2; transform: scale(1.1); } }
    .container { max-width: 1050px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 14px 22px; background: white; border-radius: 60px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); flex-wrap: wrap; gap: 10px; }
    .top-bar h1 { margin: 0; font-size: 1.25rem; font-weight: 900; background: linear-gradient(45deg, var(--primary), var(--purple), var(--pink)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .top-bar .stars { font-size: 1.4rem; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .subject-card { border-radius: 26px; padding: 30px 24px; color: white; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: transform 0.3s, box-shadow 0.3s; min-height: 240px; display: flex; flex-direction: column; justify-content: space-between; }
    .subject-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 18px 40px rgba(0,0,0,0.25); }
    .subject-card .emoji { font-size: 4rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25)); transition: transform 0.4s; }
    .subject-card:hover .emoji { transform: scale(1.15) rotate(-6deg); }
    .subject-card h2 { margin: 10px 0 8px; font-size: 1.35rem; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,0.25); }
    .subject-card p { margin: 0; font-size: 0.95rem; line-height: 1.7; opacity: 0.95; }
    .subject-card .count-badge { display: inline-block; padding: 4px 14px; border-radius: 20px; background: rgba(255,255,255,0.25); font-size: 0.8rem; margin-top: 12px; font-weight: 700; }
    .back-btn { background: linear-gradient(135deg, var(--secondary), var(--pink)); color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-size: 1rem; font-weight: 700; margin-bottom: 20px; box-shadow: 0 6px 16px rgba(241,143,1,0.4); transition: transform 0.2s; }
    .back-btn:hover { transform: translateY(-3px); }
    .section-header { background: white; border-radius: 22px; padding: 20px 26px; margin-bottom: 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); position: relative; overflow: hidden; }
    .section-header::after { content: "⭐"; position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 2.8rem; opacity: 0.3; }
    .section-header h2 { margin: 0 0 8px; font-weight: 900; font-size: 1.4rem; }
    .section-header p { margin: 0; color: #666; line-height: 1.6; font-size: 0.95rem; }
    .units-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .unit-card { border-radius: 22px; padding: 22px; color: white; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.12); transition: transform 0.3s; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; }
    .unit-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 12px 30px rgba(0,0,0,0.2); }
    .unit-card .emoji { font-size: 2.6rem; margin-bottom: 8px; }
    .unit-card h3 { margin: 4px 0 6px; font-size: 1.1rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    .unit-card p { margin: 0; font-size: 0.85rem; opacity: 0.95; line-height: 1.6; }
    .lessons-list { display: flex; flex-direction: column; gap: 14px; }
    .lesson-item { background: white; border-radius: 18px; padding: 16px 20px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: all 0.25s; border-right: 6px solid var(--primary); flex-wrap: wrap; }
    .lesson-item:hover { transform: translateX(-6px); box-shadow: 0 8px 22px rgba(0,0,0,0.14); background: #F0F8FF; }
    .lesson-item .lesson-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
    .lesson-item .lesson-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; }
    .lesson-item strong { font-size: 1.05rem; color: var(--dark); }
    .lesson-item small { color: #888; font-size: 0.82rem; }
    .lesson-item .type-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: white; white-space: nowrap; }
    .lesson-detail { background: white; border-radius: 24px; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .lesson-title-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .lesson-title-wrap .big-emoji { font-size: 2.4rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .lesson-title-wrap h3 { color: var(--primary); margin: 0; font-size: 1.3rem; font-weight: 900; flex: 1; }
    .toggle-buttons { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .toggle-btn { padding: 10px 22px; border: none; border-radius: 25px; cursor: pointer; font-size: 0.95rem; font-weight: 700; transition: all 0.25s; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
    .toggle-btn.active { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; transform: scale(1.05); }
    .toggle-btn:not(.active) { background: #EEE; color: #555; }
    .explanation-box { background: linear-gradient(135deg, #FFF9E6, #FFE5F1); padding: 20px; border-radius: 16px; border-right: 6px solid var(--secondary); line-height: 1.9; font-size: 1.05rem; color: #333; }
    .text-section { margin-top: 22px; padding: 22px; border-radius: 18px; position: relative; }
    .text-section.story { background: linear-gradient(135deg, #FFF8E1, #FFECB3); border: 3px dashed var(--secondary); }
    .text-section.quran { background: linear-gradient(135deg, #E8F5E9, #C8E6C9); border: 3px solid var(--green); }
    .text-section.quran h4 { color: var(--green); }
    .text-section.english { background: linear-gradient(135deg, #E3F2FD, #BBDEFB); border: 3px dashed var(--primary); }
    .text-section.english h4 { color: var(--primary); }
    .text-section h4 { margin: 0 0 14px 0; font-size: 1.2rem; font-weight: 900; color: var(--secondary); }
    .text-line { font-size: 1.18rem; line-height: 2; padding: 6px 12px; border-radius: 10px; margin-bottom: 4px; }
    .text-section.quran .text-line { font-family: 'Traditional Arabic', 'Amiri', serif; font-size: 1.4rem; text-align: center; font-weight: 600; color: #1B5E20; }
    .text-section.english .text-line { font-family: var(--english-font); direction: ltr; text-align: left; font-size: 1.2rem; color: #0D47A1; font-weight: 600; }
    .quiz-section { margin-top: 30px; padding-top: 24px; border-top: 3px dashed #FFD23F; }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .quiz-header h4 { color: var(--pink); font-size: 1.25rem; font-weight: 900; margin: 0; }
    .reload-btn { background: linear-gradient(135deg, var(--sky), var(--primary)); color: white; border: none; padding: 10px 18px; border-radius: 25px; cursor: pointer; font-size: 0.88rem; font-weight: 700; box-shadow: 0 4px 12px rgba(72,202,228,0.4); }
    .reload-btn:hover { transform: translateY(-2px); }
    .hint { font-size: 0.82rem; color: #888; margin-bottom: 12px; font-style: italic; }
    .question { background: #FAFAFA; border-radius: 16px; padding: 18px; margin-bottom: 16px; border: 2px solid #EEE; }
    .question p { font-weight: 800; margin: 0 0 12px 0; font-size: 1.02rem; }
    .question.english-q p { font-family: var(--english-font); direction: ltr; text-align: left; }
    .question.english-q .option-btn { font-family: var(--english-font); direction: ltr; text-align: left; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn { text-align: right; padding: 12px 18px; border: 2px solid #DDD; background: white; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.2s; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #F0F8FF; transform: translateX(-4px); }
    .option-btn.correct { background: #D4F5DD; border-color: var(--green); animation: correctPop 0.5s ease; }
    .option-btn.wrong { background: #FBD9D5; border-color: var(--danger); animation: shake 0.4s ease; }
    .option-btn:disabled { cursor: default; }
    @keyframes correctPop { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
    .feedback { margin-top: 10px; font-weight: 800; font-size: 1rem; }
    .confetti { position: fixed; font-size: 1.6rem; pointer-events: none; z-index: 999; animation: confettiFall 1.5s ease-out forwards; }
    @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-160px) rotate(360deg) scale(0.4); opacity: 0; } }
    .progress-bar { position: fixed; top: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--pink), var(--purple), var(--sky), var(--green)); width: 0%; transition: width 0.6s; z-index: 100; }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
        body { font-size: 15px; } .container { padding: 12px; }
        .top-bar { padding: 10px 16px; border-radius: 40px; } .top-bar h1 { font-size: 1rem; }
        .subject-card { min-height: 200px; padding: 22px 18px; } .subject-card .emoji { font-size: 3rem; }
        .unit-card { min-height: 140px; padding: 18px; }
        .lesson-detail { padding: 18px; border-radius: 18px; }
        .section-header::after { display: none; }
        .text-line { font-size: 1.05rem; }
        .text-section.english .text-line { font-size: 1.1rem; }
    }
/* ============================================================
   ✨ ترقية التصميم v2 — خطوط عربية جميلة + ألعاب التقييمات
   ============================================================ */
:root {
    --font-stack: 'Tajawal', 'Segoe UI', 'Tahoma', 'Arial', 'Helvetica Neue', sans-serif;
    --display-font: 'Baloo Bhaijaan 2', 'Tajawal', 'Segoe UI', 'Tahoma', sans-serif;
}
body {
    background: linear-gradient(160deg, #FFF6E9 0%, #EAF4FF 45%, #FDEFF6 100%);
    background-attachment: fixed;
}
.top-bar {
    position: sticky; top: 10px; z-index: 50;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 8px 24px rgba(60,60,120,0.10);
}
.top-bar h1, .section-header h2, .subject-card h2, .unit-card h3,
.lesson-title-wrap h3, .quiz-header h4, .text-section h4,
.game-header h3, .hub-title {
    font-family: var(--display-font);
}
.section-header, .lesson-detail, .question, .game-panel {
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 10px 28px rgba(60,60,120,0.10);
}
.subject-card, .unit-card {
    position: relative; overflow: hidden;
    box-shadow: 0 12px 28px rgba(60,60,120,0.18);
}
.subject-card::after, .unit-card::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 85% 15%, rgba(255,255,255,0.35), transparent 55%);
    pointer-events: none;
}
.lesson-item { border-right-width: 8px; }
.option-btn { font-size: 1.05rem; }

/* ---------- بطاقة الألعاب في الصفحة الرئيسية ---------- */
.games-hero-card {
    grid-column: 1 / -1;
    border-radius: 28px; padding: 34px 26px; color: white; cursor: pointer;
    background: linear-gradient(120deg, #6A5AE0 0%, #9B5DE5 45%, #FF6B9D 100%);
    box-shadow: 0 16px 36px rgba(106,90,224,0.35);
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    transition: transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden;
}
.games-hero-card:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 22px 44px rgba(106,90,224,0.45); }
.games-hero-card::before {
    content: "🎈"; position: absolute; left: 18px; bottom: -14px; font-size: 4.4rem; opacity: 0.25;
    transform: rotate(-12deg); pointer-events: none;
}
.games-hero-card .emoji { font-size: 4.2rem; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25)); animation: float 3s ease-in-out infinite; }
.games-hero-card h2 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,0.25); }
.games-hero-card p { margin: 0; font-size: 1rem; opacity: 0.96; line-height: 1.7; }
.games-hero-card .count-badge { display: inline-block; padding: 5px 16px; border-radius: 20px; background: rgba(255,255,255,0.28); font-size: 0.85rem; margin-top: 12px; font-weight: 800; }

/* ---------- صف ألعاب التقييمات ---------- */
.games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.game-card {
    border-radius: 22px; padding: 22px 20px; color: white; cursor: pointer;
    box-shadow: 0 10px 24px rgba(60,60,120,0.18); min-height: 150px;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: transform 0.25s, box-shadow 0.25s; position: relative; overflow: hidden;
}
.game-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 32px rgba(60,60,120,0.28); }
.game-card .emoji { font-size: 2.8rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
.game-card h3 { margin: 8px 0 4px; font-size: 1.15rem; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
.game-card p { margin: 0; font-size: 0.88rem; opacity: 0.95; line-height: 1.6; }
.game-card .game-badge { position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.28); padding: 4px 12px; border-radius: 16px; font-size: 0.72rem; font-weight: 800; }

/* ---------- شاشة اللعب ---------- */
.game-panel { background: white; border-radius: 24px; padding: 24px; }
.score-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.score-chip { background: linear-gradient(135deg, #FFF3D6, #FFE9F3); border: 2px solid #FFD23F; border-radius: 20px; padding: 8px 18px; font-weight: 900; color: #8a6d00; font-size: 0.95rem; }
.round-chip { background: #EEF3FF; border: 2px solid #B7C8FF; border-radius: 20px; padding: 8px 18px; font-weight: 800; color: #3D5AFE; font-size: 0.9rem; }
.game-stage { min-height: 280px; }
.game-q-title { font-family: var(--display-font); font-size: 1.2rem; font-weight: 800; color: var(--dark); margin: 0 0 18px; text-align: center; line-height: 1.8; }
.game-q-title .hl { color: var(--pink); }
.game-emoji-hint { font-size: 3.4rem; text-align: center; display: block; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }

/* أزرار اختيار كبيرة */
.big-options { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.big-opt {
    min-width: 88px; padding: 18px 22px; border-radius: 20px; border: 3px solid #E3E6F0;
    background: linear-gradient(180deg, #FFFFFF, #F6F8FF); cursor: pointer;
    font-size: 1.7rem; font-weight: 900; color: var(--dark); font-family: var(--display-font);
    transition: all 0.2s; box-shadow: 0 5px 14px rgba(60,60,120,0.08);
}
.big-opt:hover:not(:disabled) { border-color: var(--purple); transform: translateY(-4px); box-shadow: 0 10px 20px rgba(155,93,229,0.25); }
.big-opt.correct { background: #D9F8E4; border-color: var(--green); animation: correctPop 0.5s ease; }
.big-opt.wrong { background: #FBD9D5; border-color: var(--danger); animation: shake 0.4s ease; }
.big-opt:disabled { cursor: default; opacity: 0.85; }
.big-opt.text-opt { font-size: 1.15rem; font-family: var(--font-stack); min-width: 140px; }

/* لعبة التركيب والترتيب */
.slots-row { display: flex; gap: 10px; justify-content: center; margin: 18px 0 22px; flex-wrap: wrap; }
.slot {
    width: 62px; height: 68px; border-radius: 16px; border: 3px dashed #B7C8FF;
    background: #F6F8FF; display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; font-weight: 900; font-family: var(--display-font); color: var(--dark);
    transition: all 0.2s;
}
.slot.filled { border-style: solid; border-color: var(--purple); background: #F0E9FF; }
.slot.ok { border-color: var(--green); background: #D9F8E4; }
.slot.bad { border-color: var(--danger); background: #FBD9D5; animation: shake 0.4s ease; }
.bank-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
.tile {
    min-width: 62px; height: 68px; padding: 0 14px; border-radius: 16px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--sky), var(--primary)); color: white;
    font-size: 1.7rem; font-weight: 900; font-family: var(--display-font);
    box-shadow: 0 6px 14px rgba(46,134,171,0.35); transition: all 0.2s;
}
.tile:hover:not(:disabled) { transform: translateY(-5px) scale(1.05); }
.tile:disabled { opacity: 0.25; transform: scale(0.92); cursor: default; }
.game-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.action-btn {
    border: none; border-radius: 24px; padding: 12px 26px; cursor: pointer;
    font-size: 1rem; font-weight: 800; font-family: var(--font-stack);
    transition: transform 0.2s; box-shadow: 0 5px 14px rgba(60,60,120,0.15);
}
.action-btn:hover { transform: translateY(-3px); }
.action-btn.check { background: linear-gradient(135deg, var(--green), #1E8449); color: white; }
.action-btn.undo { background: #EEF1F8; color: #556; }
.action-btn.next { background: linear-gradient(135deg, var(--secondary), var(--pink)); color: white; }

/* لعبة التوصيل */
.match-wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.match-col { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 130px; }
.match-word, .match-pic {
    border: 3px solid #E3E6F0; background: white; border-radius: 16px; cursor: pointer;
    padding: 12px; font-size: 1.25rem; font-weight: 800; text-align: center; color: var(--dark);
    transition: all 0.2s; font-family: var(--display-font);
}
.match-pic { font-size: 2rem; padding: 8px; }
.match-word.selected, .match-pic.selected { border-color: var(--purple); background: #F0E9FF; transform: scale(1.05); }
.match-word.done, .match-pic.done { border-color: var(--green); background: #D9F8E4; cursor: default; }
.match-word.bad, .match-pic.bad { border-color: var(--danger); background: #FBD9D5; animation: shake 0.4s ease; }

/* صواب أم خطأ */
.tf-row { display: flex; gap: 16px; justify-content: center; margin-top: 10px; }
.tf-btn {
    border: none; border-radius: 22px; padding: 18px 34px; cursor: pointer;
    font-size: 1.35rem; font-weight: 900; font-family: var(--display-font); color: white;
    transition: all 0.2s; box-shadow: 0 8px 18px rgba(60,60,120,0.18);
}
.tf-btn.true { background: linear-gradient(135deg, #2ECC71, #1E8449); }
.tf-btn.false { background: linear-gradient(135deg, #FF7B7B, #E74C3C); }
.tf-btn:hover:not(:disabled) { transform: translateY(-4px) scale(1.04); }
.tf-btn:disabled { opacity: 0.55; cursor: default; }
.tf-sentence { background: linear-gradient(135deg, #FFF9E6, #FFE5F1); border-radius: 18px; border-right: 6px solid var(--secondary); padding: 20px; font-size: 1.3rem; font-weight: 800; text-align: center; line-height: 2; color: #333; }

/* شاشة النتيجة */
.result-box { text-align: center; padding: 26px 12px; }
.result-box .big-stars { font-size: 3.2rem; margin-bottom: 10px; }
.result-box h3 { font-family: var(--display-font); font-size: 1.5rem; margin: 0 0 8px; color: var(--dark); }

var appState = { view: 'subjects', subjectKey: null, unitKey: null, lessonId: null };

function updateProgress(pct) { document.getElementById('progressBar').style.width = pct + '%'; }

function hideAllViews() {

}

    for (var i = 0; i < lines.length; i++) { if (lines[i].trim()) { linesHtml += '<div class="text-line">' + lines[i] + '</div>'; } }

    var title = isQuran ? '📖 النص القرآني' : (isEnglish ? '📖 English Text' : '📖 النص');
    return '<div class="text-section ' + cls + '"><h4>' + title + '</h4><div>' + linesHtml + '</div></div>';
}

    if (!lesson) return;

        extra = '<div style="margin-top:12px; padding-top:12px; border-top:2px dashed #F18F01; color:#666; font-size:0.95rem; font-weight:600;">👇 تجد <strong>' + (lesson.textType === 'quran' ? 'النص القرآني' : 'النص') + '</strong> كاملًا في القسم التالي.</div>';
    }
    box.innerHTML = txt + extra;
}

var QUIZ_COUNT = 4;
function shuffleArray(arr) { var copy = arr.slice(); for (var i = copy.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var temp = copy[i]; copy[i] = copy[j]; copy[j] = temp; } return copy; }
function prepareQuestion(q) {
    var options = q.options.slice();
    var correctText = options[q.answer];
    var shuffled = shuffleArray(options);
    var newAnswerIndex = 0;
    for (var i = 0; i < shuffled.length; i++) { if (shuffled[i] === correctText) { newAnswerIndex = i; break; } }
    return { q: q.q, options: shuffled, answer: newAnswerIndex };
}
function getRandomQuestions(pool) {
    var count = Math.min(QUIZ_COUNT, pool.length);
    var shuffled = shuffleArray(pool);
    var selected = shuffled.slice(0, count);
    var prepared = [];
    for (var i = 0; i < selected.length; i++) { prepared.push(prepareQuestion(selected[i])); }
    return prepared;
}

function renderQuiz(lesson) {
    var quizContainer = document.getElementById('quiz-container');
    if (!lesson.questions || lesson.questions.length === 0) { quizContainer.innerHTML = ''; return; }
    quizContainer.innerHTML = '<div class="quiz-header"><h4>✏️ حان وقت الأسئلة!</h4><button class="reload-btn" onclick="reloadQuiz()">🔄 أسئلة جديدة</button></div><p class="hint">💡 الأسئلة تتغير في كل مرة تفتح فيها الدرس!</p><div id="questions-list"></div>';
    displayQuestions(lesson);
}

function displayQuestions(lesson) {
    var list = document.getElementById('questions-list');
    if (!list) return;
    list.innerHTML = '';
    var questions = getRandomQuestions(lesson.questions);
    var isEnglishLesson = (appState.subjectKey === 'english');
    for (var i = 0; i < questions.length; i++) {
        (function(q, qIndex, isEng) {
            var qDiv = document.createElement('div');
            qDiv.className = 'question' + (isEng ? ' english-q' : '');
            qDiv.innerHTML = '<p>' + (qIndex + 1) + '. ' + q.q + '</p>';
            var optsDiv = document.createElement('div');
            optsDiv.className = 'options';
            for (var j = 0; j < q.options.length; j++) {
                (function(opt, optIndex) {
                    var btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = function(e) { checkAnswer(btn, optIndex, q.answer, optsDiv, qIndex, e); };
                    optsDiv.appendChild(btn);
                })(q.options[j], j);
            }
            qDiv.appendChild(optsDiv);
            var feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = 'feedback-' + qIndex;
            qDiv.appendChild(feedback);
            list.appendChild(qDiv);
        })(questions[i], i, isEnglishLesson);
    }
}

function reloadQuiz() {
    var subj = subjectsData[appState.subjectKey];
    var unit = subj.units[appState.unitKey];
    var lesson = null;
    for (var i = 0; i < unit.lessons.length; i++) { if (unit.lessons[i].id === appState.lessonId) { lesson = unit.lessons[i]; break; } }
    if (!lesson) return;
    displayQuestions(lesson);
}

function checkAnswer(btn, chosen, correct, optsDiv, qIndex, event) {
    var buttons = optsDiv.querySelectorAll('.option-btn');
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
    if (chosen === correct) {
        btn.classList.add('correct');
        document.getElementById('feedback-' + qIndex).innerHTML = '<span style="color:#27AE60;">✅ إجابة صحيحة! أحسنت يا بطل 🌟</span>';
        spawnConfetti(event);
    } else {
        btn.classList.add('wrong');
        buttons[correct].classList.add('correct');
        document.getElementById('feedback-' + qIndex).innerHTML = '<span style="color:#E74C3C;">❌ حاول مرة أخرى. الإجابة الصحيحة بالأخضر.</span>';
    }
}

function spawnConfetti(event) {
    var emojis = ['⭐', '🌟', '✨', '💫', '🎉', '🏆'];
    var x = (event && event.clientX) ? event.clientX : window.innerWidth / 2;
    var y = (event && event.clientY) ? event.clientY : window.innerHeight / 2;
    for (var i = 0; i < 8; i++) {
        var el = document.createElement('div');
        el.className = 'confetti';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = (x + (Math.random() - 0.5) * 120) + 'px';
        el.style.top = y + 'px';
        el.style.animationDelay = (Math.random() * 0.3) + 's';
        document.body.appendChild(el);
        (function(node) { setTimeout(function() { if (node.parentNode) node.parentNode.removeChild(node); }, 1800); })(el);
    }
}

var GAME_ROUNDS = 5;
var gameState = null;

function playTone(ok) {
    try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = window.__actx || (window.__actx = new AC());
        if (ctx.state === 'suspended') ctx.resume();
        var notes = ok ? [523.25, 659.25, 783.99] : [196, 146.83];
        for (var i = 0; i < notes.length; i++) {
            (function(freq, idx) {
                var o = ctx.createOscillator(), g = ctx.createGain();
                o.type = 'sine'; o.frequency.value = freq;
                o.connect(g); g.connect(ctx.destination);
                var t = ctx.currentTime + idx * 0.13;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
                o.start(t); o.stop(t + 0.32);
            })(notes[i], i);
        }
    } catch (e) {}
}

function showGames() {
    appState.view = 'games';
    hideAllViews();
    document.getElementById('games-view').classList.remove('hidden');
    document.getElementById('page-subtitle').textContent = 'الألعاب والتقييمات - اختر لعبة وابدأ التحدي';
    document.getElementById('games-header').innerHTML = '<h2 style="color:#6A5AE0;">🎮 الألعاب والتقييمات</h2><p>' + gamesData.length + ' ألعاب متنوعة من نماذج التقييمات: حروف، تركيب، توصيل، وجُمَل. الأسئلة تتجدد في كل مرة!</p>';
    updateProgress(35);
    var grid = document.getElementById('games-grid');
    grid.innerHTML = '';
    for (var i = 0; i < gamesData.length; i++) {
        (function(g) {
            var card = document.createElement('div');
            card.className = 'game-card';
            card.style.background = g.gradient;
            var count = g.type === 'match' ? g.sets.length : g.items.length;
            card.innerHTML = '<span class="game-badge">' + g.badge + '</span>' +
                '<div class="emoji">' + g.emoji + '</div>' +
                '<div><h3>' + g.title + '</h3><p>' + g.desc + '</p></div>' +
                '<span class="count-badge">' + count + ' سؤال</span>';
            card.onclick = function() { openGame(g.id); };
            grid.appendChild(card);
        })(gamesData[i]);
    }
    window.scrollTo(0, 0);
}

function openGame(gameId) {
    var game = null;
    for (var i = 0; i < gamesData.length; i++) { if (gamesData[i].id === gameId) { game = gamesData[i]; break; } }
    if (!game) return;
    var pool = game.type === 'match' ? shuffleArray(game.sets) : shuffleArray(game.items);
    gameState = { game: game, round: 0, score: 0, order: pool, total: Math.min(GAME_ROUNDS, pool.length) };
    appState.view = 'game';
    hideAllViews();
    document.getElementById('game-play-view').classList.remove('hidden');
    document.getElementById('game-header').innerHTML = '<h2 style="color:#6A5AE0;">' + game.emoji + ' ' + game.title + '</h2><p>' + game.desc + '</p>';
    document.getElementById('page-subtitle').textContent = game.title;
    updateProgress(60);
    renderGameRound();
    window.scrollTo(0, 0);
}

function updateScoreBar() {
    document.getElementById('score-chip').innerHTML = '⭐ النجوم: ' + gameState.score + ' من ' + gameState.total;
    document.getElementById('round-chip').innerHTML = 'سؤال ' + (gameState.round + 1) + ' من ' + gameState.total;
}

function renderGameRound() {
    var st = gameState;
    if (st.round >= st.total) { renderGameResult(); return; }
    updateScoreBar();
    var item = st.order[st.round];
    var stage = document.getElementById('game-stage');
    stage.innerHTML = '';
    if (st.game.type === 'choice') renderChoiceRound(stage, st.game, item);
    else if (st.game.type === 'seq') renderSeqRound(stage, st.game, item);
    else if (st.game.type === 'match') renderMatchRound(stage, st.game, item);
    else if (st.game.type === 'tf') renderTfRound(stage, st.game, item);
}

function finishRound(correct) {
    if (correct) { gameState.score++; playTone(true); }
    else { playTone(false); }
    updateScoreBar();
    setTimeout(function() {
        if (!gameState) return;
        gameState.round++;
        renderGameRound();
    }, correct ? 1400 : 2100);
}

function renderGameResult() {
    var st = gameState;
    document.getElementById('score-chip').innerHTML = '⭐ النجوم: ' + st.score + ' من ' + st.total;
    document.getElementById('round-chip').innerHTML = 'انتهت اللعبة';
    updateProgress(100);
    var stars, msg;
    if (st.score === st.total) { stars = '🏆🌟⭐'; msg = 'مذهل! نتيجة كاملة، أنت بطل حقيقي!'; }
    else if (st.score >= st.total - 1) { stars = '🌟🌟'; msg = 'رائع جدًا! خطوة واحدة وتصل للقمة!'; }
    else if (st.score >= Math.ceil(st.total / 2)) { stars = '⭐⭐'; msg = 'أحسنت! تدرّب أكثر وستصبح بطلًا!'; }
    else { stars = '💪'; msg = 'محاولة جيدة! جرّب مرة أخرى وستتحسن!'; }
    var stage = document.getElementById('game-stage');
    stage.innerHTML = '<div class="result-box"><div class="big-stars">' + stars + '</div>' +
        '<h3>' + msg + '</h3><p>نتيجتك: ' + st.score + ' من ' + st.total + ' في لعبة ' + st.game.title + '</p>' +
        '<div class="game-actions">' +
        '<button class="action-btn next" onclick="openGame(\'' + st.game.id + '\')">🔁 العب مرة أخرى</button>' +
        '<button class="action-btn undo" onclick="showGames()">🎮 كل الألعاب</button>' +
        '</div></div>';
    spawnConfetti(null);
    window.scrollTo(0, 0);
}

/* ---------- لعبة الاختيارات (حرف ناقص / أصوات / أكمل الجملة) ---------- */
function renderChoiceRound(stage, game, item) {
    var isSentence = !!game.sentence;
    var html = '<p class="game-q-title">' + game.qtext + '</p>';
    if (isSentence) {
        html += '<div class="tf-sentence">' + item.display + '</div>';
    } else {
        html += '<div class="tf-sentence" style="font-family:var(--display-font); font-size:2rem;">' + item.display + '</div>';
    }
    html += '<div class="big-options" style="margin-top:18px;"></div><div class="feedback" style="text-align:center;"></div>';
    stage.innerHTML = html;
    var optsDiv = stage.querySelector('.big-options');
    var feedback = stage.querySelector('.feedback');
    var prepared = prepareQuestion(item);
    for (var j = 0; j < prepared.options.length; j++) {
        (function(opt, idx) {
            var btn = document.createElement('button');
            btn.className = 'big-opt' + (isSentence ? ' text-opt' : '');
            btn.textContent = opt;
            btn.onclick = function(e) {
                var buttons = optsDiv.querySelectorAll('.big-opt');
                for (var b = 0; b < buttons.length; b++) buttons[b].disabled = true;
                var correct = (idx === prepared.answer);
                if (correct) {
                    btn.classList.add('correct');
                    feedback.innerHTML = '<span style="color:#27AE60;">✅ إجابة صحيحة! أحسنت يا بطل 🌟' + (item.full ? ' الكلمة: <strong>' + item.full + '</strong>' : '') + '</span>';
                    spawnConfetti(e);
                } else {
                    btn.classList.add('wrong');
                    buttons[prepared.answer].classList.add('correct');
                    feedback.innerHTML = '<span style="color:#E74C3C;">❌ الإجابة الصحيحة باللون الأخضر.' + (item.full ? ' الكلمة: <strong>' + item.full + '</strong>' : '') + '</span>';
                }
                finishRound(correct);
            };
            optsDiv.appendChild(btn);
        })(prepared.options[j], j);
    }
}

/* ---------- ألعاب التركيب والترتيب والتقطيع ---------- */
function renderSeqRound(stage, game, item) {
    var html = '<p class="game-q-title">' + game.qtext + '</p>';
    if (game.showIcon && item.icon) html += '<span class="game-emoji-hint">' + iconSVG(item.icon, 84) + '</span>';
    if (game.showWord) html += '<div class="tf-sentence" style="font-family:var(--display-font); font-size:1.9rem;">' + item.word + '</div>';
    html += '<div class="slots-row"></div><div class="bank-row"></div>' +
        '<div class="game-actions">' +
        '<button class="action-btn undo" id="seq-undo">↩️ تراجع</button>' +
        '<button class="action-btn check" id="seq-check">✔️ تحقق</button>' +
        '</div><div class="feedback" style="text-align:center;"></div>';
    stage.innerHTML = html;
    var slotsRow = stage.querySelector('.slots-row');
    var bankRow = stage.querySelector('.bank-row');
    var feedback = stage.querySelector('.feedback');
    var checkBtn = stage.querySelector('#seq-check');
    var undoBtn = stage.querySelector('#seq-undo');
    var picked = [];
    var tiles = [];
    var slots = [];
    for (var s = 0; s < item.pieces.length; s++) {
        var slot = document.createElement('div');
        slot.className = 'slot';
        slotsRow.appendChild(slot);
        slots.push(slot);
    }
    var bankOrder = shuffleArray(item.pieces.map(function(p, i) { return i; }));
    for (var b = 0; b < bankOrder.length; b++) {
        (function(pieceIdx) {
            var tile = document.createElement('button');
            tile.className = 'tile';
            tile.textContent = item.pieces[pieceIdx];
            tile.onclick = function() {
                if (picked.length >= item.pieces.length) return;
                tile.disabled = true;
                picked.push(pieceIdx);
                var slot = slots[picked.length - 1];
                slot.textContent = item.pieces[pieceIdx];
                slot.classList.add('filled');
                syncSeqButtons();
            };
            bankRow.appendChild(tile);
            tiles.push({ tile: tile, pieceIdx: pieceIdx });
        })(bankOrder[b]);
    }
    function syncSeqButtons() {
        checkBtn.disabled = picked.length !== item.pieces.length;
        checkBtn.style.opacity = checkBtn.disabled ? '0.5' : '1';
        undoBtn.disabled = picked.length === 0;
        undoBtn.style.opacity = undoBtn.disabled ? '0.5' : '1';
    }
    syncSeqButtons();
    undoBtn.onclick = function() {
        if (!picked.length) return;
        var lastIdx = picked.pop();
        for (var t = 0; t < tiles.length; t++) { if (tiles[t].pieceIdx === lastIdx && tiles[t].tile.disabled) { tiles[t].tile.disabled = false; break; } }
        var slot = slots[picked.length];
        slot.textContent = '';
        slot.classList.remove('filled', 'ok', 'bad');
        feedback.innerHTML = '';
        syncSeqButtons();
    };
    checkBtn.onclick = function() {
        var built = '';
        for (var p = 0; p < picked.length; p++) built += item.pieces[picked[p]];
        var correct = (built === item.pieces.join(''));
        if (correct) {
            for (var i = 0; i < slots.length; i++) slots[i].classList.add('ok');
            for (var t2 = 0; t2 < tiles.length; t2++) tiles[t2].tile.disabled = true;
            checkBtn.disabled = true; undoBtn.disabled = true;
            feedback.innerHTML = '<span style="color:#27AE60;">✅ رائع! الكلمة هي <strong>' + item.word + '</strong> 🌟</span>';
            spawnConfetti(null);
            finishRound(true);
        } else {
            for (var k = 0; k < slots.length; k++) slots[k].classList.add('bad');
            feedback.innerHTML = '<span style="color:#E74C3C;">❌ ليست صحيحة.. حاول ترتيبًا آخر!</span>';
            setTimeout(function() {
                for (var k2 = 0; k2 < slots.length; k2++) { slots[k2].textContent = ''; slots[k2].classList.remove('filled', 'bad'); }
                for (var t3 = 0; t3 < tiles.length; t3++) tiles[t3].tile.disabled = false;
                picked = [];
                syncSeqButtons();
            }, 1000);
        }
    };
}

/* ---------- لعبة التوصيل ---------- */
function renderMatchRound(stage, game, pairs) {
    var html = '<p class="game-q-title">' + game.qtext + '</p><div class="match-wrap"><div class="match-col" id="match-words"></div><div class="match-col" id="match-pics"></div></div><div class="feedback" style="text-align:center;"></div>';
    stage.innerHTML = html;
    var wordsCol = stage.querySelector('#match-words');
    var picsCol = stage.querySelector('#match-pics');
    var feedback = stage.querySelector('.feedback');
    var selectedWord = null;
    var doneCount = 0;
    var words = shuffleArray(pairs.slice());
    var pics = shuffleArray(pairs.slice());
    for (var i = 0; i < words.length; i++) {
        (function(pair) {
            var btn = document.createElement('button');
            btn.className = 'match-word';
            btn.textContent = pair.w;
            btn.onclick = function() {
                if (btn.classList.contains('done')) return;
                var prev = wordsCol.querySelector('.selected');
                if (prev) prev.classList.remove('selected');
                btn.classList.add('selected');
                selectedWord = { btn: btn, pair: pair };
            };
            wordsCol.appendChild(btn);
        })(words[i]);
    }
    for (var j = 0; j < pics.length; j++) {
        (function(pair) {
            var btn = document.createElement('button');
            btn.className = 'match-pic';
            btn.setAttribute('data-icon', pair.icon);
            btn.innerHTML = iconSVG(pair.icon, 44);
            btn.onclick = function() {
                if (btn.classList.contains('done') || !selectedWord) return;
                var wBtn = selectedWord.btn;
                if (selectedWord.pair === pair) {
                    wBtn.classList.remove('selected'); wBtn.classList.add('done');
                    btn.classList.add('done');
                    selectedWord = null;
                    doneCount++;
                    playTone(true);
                    feedback.innerHTML = '<span style="color:#27AE60;">✅ توصيلة صحيحة!</span>';
                    if (doneCount === pairs.length) {
                        feedback.innerHTML = '<span style="color:#27AE60;">🎉 أكملت كل التوصيلات! أحسنت 🌟</span>';
                        spawnConfetti(null);
                        finishRound(true);
                    }
                } else {
                    wBtn.classList.add('bad'); btn.classList.add('bad');
                    playTone(false);
                    feedback.innerHTML = '<span style="color:#E74C3C;">❌ ليست الصورة المناسبة.. حاول مرة أخرى!</span>';
                    setTimeout(function() {
                        wBtn.classList.remove('bad', 'selected'); btn.classList.remove('bad');
                        selectedWord = null;
                    }, 700);
                }
            };
            picsCol.appendChild(btn);
        })(pics[j]);
    }
}

/* ---------- لعبة صواب أم خطأ ---------- */
function renderTfRound(stage, game, item) {
    var html = '<p class="game-q-title">' + game.qtext + '</p>' +
        '<div class="tf-sentence">' + item.s + '</div>' +
        '<div class="tf-row"><button class="tf-btn true" id="tf-true">✅ صواب</button><button class="tf-btn false" id="tf-false">❌ خطأ</button></div>' +
        '<div class="feedback" style="text-align:center; margin-top:14px;"></div>';
    stage.innerHTML = html;
    var feedback = stage.querySelector('.feedback');
    var trueBtn = stage.querySelector('#tf-true');
    var falseBtn = stage.querySelector('#tf-false');
    function answer(chosen, btn, e) {
        trueBtn.disabled = true; falseBtn.disabled = true;
        var correct = (chosen === item.a);
        if (correct) {
            btn.style.boxShadow = '0 0 0 5px #D9F8E4';
            feedback.innerHTML = '<span style="color:#27AE60;">✅ إجابة صحيحة! أحسنت 🌟</span>';
            spawnConfetti(e);
        } else {
            btn.style.boxShadow = '0 0 0 5px #FBD9D5';
            feedback.innerHTML = '<span style="color:#E74C3C;">❌ الإجابة الصحيحة هي: <strong>' + (item.a ? 'صواب' : 'خطأ') + '</strong></span>';
        }
        finishRound(correct);
    }
    trueBtn.onclick = function(e) { answer(true, trueBtn, e); };
    falseBtn.onclick = function(e) { answer(false, falseBtn, e); };
}


function initApp() { showSubjects(); }
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initApp); } else { initApp(); }
</script>
